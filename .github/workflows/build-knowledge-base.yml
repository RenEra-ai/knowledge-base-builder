name: Build Knowledge Base

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6am UTC
  workflow_dispatch:       # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache sentence-transformers model
      uses: actions/cache@v4
      with:
        path: ~/.cache/torch/sentence_transformers
        key: st-all-MiniLM-L6-v2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build URL tree
      run: python build_url_tree.py --validate

    - name: Scrape documentation
      run: python main.py

    - name: Chunk documents
      run: python chunk_docs.py --verbose

    - name: Build semantic index
      run: python build_index.py --verify

    - name: Package artifact
      run: tar -czf boomi_knowledge_db.tar.gz boomi_knowledge_db/

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: boomi-knowledge-db
        path: boomi_knowledge_db.tar.gz
        retention-days: 90

    - name: Create GitHub release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: kb-${{ github.run_number }}
        name: Knowledge Base Build ${{ github.run_number }}
        files: boomi_knowledge_db.tar.gz
        generate_release_notes: true
