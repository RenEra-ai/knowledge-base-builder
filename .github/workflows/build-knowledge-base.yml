name: Build Knowledge Base

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6am UTC
  workflow_dispatch:
    inputs:
      pipeline:
        description: >-
          Chunking pipeline: legacy (token-estimate splitter, kb-24 lineage)
          or s5 (tokenizer-aware kb-25 pipeline over a frozen source snapshot)
        type: choice
        options: [legacy, s5]
        default: legacy
      candidate:
        description: >-
          kb-25 candidate for the s5 pipeline (c0 uses the legacy splitter and
          is only meaningful with pipeline=legacy; b567 additionally requires
          s7_cache.jsonl + s7_contract.json checked in at the repo root)
        type: choice
        options: [c0, b5, b56, b567]
        default: c0
      mode:
        description: >-
          freeze = scrape + freeze the source snapshot and upload it as an
          artifact, then stop (build no candidate); build = chunk + build a
          candidate (optionally reusing a previously frozen snapshot)
        type: choice
        options: [build, freeze]
        default: build
      snapshot_run_id:
        description: >-
          Run id of a previous 'freeze' dispatch. When set, the build downloads
          that run's kb25-source-snapshot artifact and SKIPS scraping, so every
          candidate is built from byte-identical sources. Empty scrapes fresh.
        type: string
        default: ''
      publish:
        description: >-
          Publish a GitHub release from the built artifact. Off by default so
          candidates can be built and evaluated without cutting a release.
        type: boolean
        default: false
      release_tag:
        description: >-
          Release tag to publish under (e.g. kb-25). Empty falls back to
          kb-<run_number>. Only used when publish is true.
        type: string
        default: ''
      verify:
        description: >-
          Run build_index's coarse post-build smoke queries as a hard gate
          (default true). Set false to still produce the artifact when the
          coarse HNSW-approximate check flags a borderline query — the
          authoritative retrieval gate is the eval harness, not this smoke test.
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  # Key on mode+candidate so candidate builds that REUSE a frozen snapshot
  # (no scrape) run in parallel instead of serializing. A fresh scrape only
  # ever happens for the single freeze run (its own mode group), so this does
  # not permit two simultaneous scrapes in the staged flow.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  prepare-config:
    if: inputs.snapshot_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      scrape_matrix: ${{ steps.partition.outputs.matrix }}
      shard_count: ${{ steps.partition.outputs.shard_count }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx beautifulsoup4

    - name: Build URL tree
      run: python build_url_tree.py

    - name: Partition scrape workload
      id: partition
      run: python build_scrape_matrix.py --shards 4 --github-output "$GITHUB_OUTPUT"

    - name: Upload config artifact
      uses: actions/upload-artifact@v4
      with:
        name: generated-config
        path: config.json
        retention-days: 7

  scrape:
    if: inputs.snapshot_run_id == ''
    needs: prepare-config
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare-config.outputs.scrape_matrix) }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Download generated config
      uses: actions/download-artifact@v4
      with:
        name: generated-config
        path: .

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx beautifulsoup4

    - name: Scrape documentation shard
      run: |
        python main.py \
          --config config.json \
          --root-indices "${{ matrix.root_indices }}" \
          --delay 2.0 \
          --output-dir "knowledge_base/shard-${{ matrix.shard }}" \
          --failed-urls-file "failed_urls_shard_${{ matrix.shard }}.txt"

    - name: Package shard artifact
      run: |
        mkdir -p artifacts
        tar -czf "artifacts/knowledge-base-shard-${{ matrix.shard }}.tar.gz" \
          "knowledge_base/shard-${{ matrix.shard }}" \
          "failed_urls_shard_${{ matrix.shard }}.txt"

    - name: Upload shard artifact
      uses: actions/upload-artifact@v4
      with:
        name: knowledge-base-shard-${{ matrix.shard }}
        path: artifacts/knowledge-base-shard-${{ matrix.shard }}.tar.gz
        retention-days: 7

  scrape-report:
    if: always() && inputs.snapshot_run_id == ''
    needs: [prepare-config, scrape]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Download available scrape artifacts
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: knowledge-base-shard-*
        path: artifacts
        merge-multiple: true

    - name: Build scrape report
      run: |
        python summarize_scrape_artifacts.py \
          --artifacts-dir artifacts \
          --expected-shards "${{ needs.prepare-config.outputs.shard_count || '0' }}" \
          --output scrape-report/scrape-report.md \
          --failed-urls-output scrape-report/failed_urls.txt

    - name: Upload scrape report artifact
      uses: actions/upload-artifact@v4
      with:
        name: scrape-report
        path: scrape-report/
        retention-days: 30

  build-artifact:
    needs: scrape
    # Run on a successful fresh scrape, or on any snapshot-reuse dispatch (where
    # scrape is intentionally skipped). Stays fail-closed if scrape is skipped
    # for any other reason (e.g. a prepare-config failure) — no shard artifacts.
    if: always() && (needs.scrape.result == 'success' || inputs.snapshot_run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache sentence-transformers model
      uses: actions/cache@v4
      with:
        path: ~/.cache/torch/sentence_transformers
        key: st-all-MiniLM-L6-v2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate pipeline/candidate combination
      if: inputs.mode != 'freeze'
      run: |
        # The two inputs are orthogonal in the form but not independent: the
        # legacy pipeline only ever builds the c0 baseline, and the s5 pipeline
        # cannot build c0 (build_index rejects S5 chunks under c0). Fail fast
        # with a clear message rather than produce a mislabeled artifact.
        if [ "${{ inputs.pipeline }}" = "legacy" ] && [ -n "${{ inputs.candidate }}" ] && [ "${{ inputs.candidate }}" != "c0" ]; then
          echo "::error::pipeline=legacy only builds candidate c0; got '${{ inputs.candidate }}'"
          exit 1
        fi
        if [ "${{ inputs.pipeline }}" = "s5" ] && [ "${{ inputs.candidate }}" = "c0" ]; then
          echo "::error::pipeline=s5 cannot build c0 (the legacy baseline); choose b5/b56/b567"
          exit 1
        fi

    # --- fresh-scrape path (no snapshot reuse) --------------------------------

    - name: Download scrape artifacts
      if: inputs.snapshot_run_id == ''
      uses: actions/download-artifact@v4
      with:
        pattern: knowledge-base-shard-*
        path: artifacts
        merge-multiple: true

    - name: Assemble knowledge base
      if: inputs.snapshot_run_id == ''
      run: python assemble_scrape_artifacts.py --artifacts-dir artifacts --output-dir knowledge_base --failed-urls-output combined_failed_urls.txt

    - name: Fetch companion sources
      if: inputs.snapshot_run_id == ''
      run: python fetch_companion.py --config companion_sources.json --staging companion_sources --manifest companion_manifest.json

    - name: Freeze source snapshot
      # Freeze whenever we scraped fresh AND a snapshot is needed downstream:
      # freeze mode (the deliverable) or any s5 candidate build. The legacy
      # weekly build (mode/pipeline unset on schedule) keeps chunking directly.
      if: inputs.snapshot_run_id == '' && (inputs.mode == 'freeze' || inputs.pipeline == 's5')
      run: |
        python snapshot.py freeze \
          --official knowledge_base/ \
          --companion-staging companion_sources/ \
          --companion-manifest companion_manifest.json \
          --companion-config companion_sources.json \
          --out source_snapshot/
        SNAP=$(python snapshot.py verify --snapshot source_snapshot/ | awk '/source_snapshot_sha256/ {print $2}')
        echo "SOURCE_SNAPSHOT_SHA256=$SNAP" >> "$GITHUB_ENV"

    # --- snapshot-reuse path --------------------------------------------------

    - name: Download frozen snapshot
      if: inputs.snapshot_run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: kb25-source-snapshot
        path: .
        run-id: ${{ inputs.snapshot_run_id }}
        github-token: ${{ github.token }}

    - name: Unpack and verify reused snapshot
      if: inputs.snapshot_run_id != ''
      run: |
        tar -xzf source_snapshot.tar.gz
        SNAP=$(python snapshot.py verify --snapshot source_snapshot/ | awk '/source_snapshot_sha256/ {print $2}')
        echo "SOURCE_SNAPSHOT_SHA256=$SNAP" >> "$GITHUB_ENV"

    # --- freeze mode: publish the snapshot as the deliverable, then stop ------

    - name: Package frozen snapshot
      if: inputs.mode == 'freeze'
      run: tar -czf source_snapshot.tar.gz source_snapshot/

    - name: Upload frozen snapshot artifact
      if: inputs.mode == 'freeze'
      uses: actions/upload-artifact@v4
      with:
        name: kb25-source-snapshot
        path: source_snapshot.tar.gz
        retention-days: 90

    - name: Report frozen snapshot sha
      if: inputs.mode == 'freeze'
      run: |
        echo "### Frozen source snapshot" >> "$GITHUB_STEP_SUMMARY"
        echo "- run id (reuse via snapshot_run_id): ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- source_snapshot_sha256: ${SOURCE_SNAPSHOT_SHA256}" >> "$GITHUB_STEP_SUMMARY"

    # --- build mode: chunk + index -------------------------------------------

    - name: Chunk documents (legacy)
      if: inputs.mode != 'freeze' && inputs.pipeline != 's5'
      run: |
        if [ -n "${{ inputs.snapshot_run_id }}" ]; then
          # C0 built from the same frozen bytes as the S5 candidates.
          python chunk_docs.py --verbose --snapshot source_snapshot/
        else
          python chunk_docs.py --verbose \
            --companion-input companion_sources \
            --companion-manifest companion_manifest.json
        fi

    - name: Chunk documents (S5)
      if: inputs.mode != 'freeze' && inputs.pipeline == 's5'
      run: python s5_pipeline.py --snapshot source_snapshot/ --output chunks.jsonl

    - name: Build semantic index (legacy)
      if: inputs.mode != 'freeze' && inputs.pipeline != 's5'
      run: |
        VERIFY="--verify"
        if [ "${{ inputs.verify }}" = "false" ]; then VERIFY=""; fi
        python build_index.py $VERIFY \
          --artifact-tag "kb-${{ github.run_number }}" \
          --builder-commit "${{ github.sha }}"

    - name: Build semantic index (candidate)
      if: inputs.mode != 'freeze' && inputs.pipeline == 's5'
      run: |
        EXTRA=""
        if [ "${{ inputs.candidate }}" = "b567" ]; then
          EXTRA="--s7-cache s7_cache.jsonl --s7-contract s7_contract.json"
        fi
        VERIFY="--verify"
        if [ "${{ inputs.verify }}" = "false" ]; then VERIFY=""; fi
        python build_index.py $VERIFY \
          --candidate "${{ inputs.candidate }}" \
          --source-snapshot-sha256 "$SOURCE_SNAPSHOT_SHA256" \
          --semantic-inputs-out boomi_knowledge_db/semantic_inputs.jsonl \
          --artifact-tag "kb-${{ github.run_number }}" \
          --builder-commit "${{ github.sha }}" \
          $EXTRA

    - name: Bundle failed URL report
      if: inputs.mode != 'freeze'
      run: |
        if [ -f combined_failed_urls.txt ]; then
          cp combined_failed_urls.txt boomi_knowledge_db/_failed_urls.txt
        else
          echo "reused snapshot ${{ inputs.snapshot_run_id }}: failed-URL report not carried in the snapshot" \
            > boomi_knowledge_db/_failed_urls.txt
        fi

    - name: Package artifact
      if: inputs.mode != 'freeze'
      run: tar -czf boomi_knowledge_db.tar.gz boomi_knowledge_db/

    - name: Upload workflow artifact
      if: inputs.mode != 'freeze'
      uses: actions/upload-artifact@v4
      with:
        name: boomi-knowledge-db
        path: boomi_knowledge_db.tar.gz
        retention-days: 90

    - name: Build release notes
      if: github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.mode != 'freeze'
      run: |
        python - <<'EOF'
        import json, os

        with open("boomi_knowledge_db/manifest.json", encoding="utf-8") as f:
            manifest = json.load(f)

        failed = 0
        if os.path.exists("combined_failed_urls.txt"):
            with open("combined_failed_urls.txt", encoding="utf-8") as f:
                failed = sum(1 for line in f if line.strip())

        top = sorted(manifest["category_counts"].items(), key=lambda kv: -kv[1])[:5]

        stc = manifest.get("source_type_counts", {})
        provenance = ", ".join(
            f"{name} ({count:,})"
            for name, count in sorted(stc.items(), key=lambda kv: -kv[1])
        ) or "official"

        lines = [
            f"## Boomi Documentation Corpus `{manifest['artifact_tag'] or manifest['builder_commit']}`",
            "",
            f"- **Build timestamp:** {manifest['build_timestamp']}",
            f"- **Chunks:** {manifest['chunk_count']:,}",
            f"- **Pages:** {manifest['page_count']:,}",
            f"- **Embedding model:** {manifest['embedding_model']} ({manifest['embedding_dim']} dim)",
            f"- **Provenance:** {provenance}",
            f"- **Failed source URLs:** {failed:,}",
        ]
        companion = manifest.get("companion")
        if companion:
            lines.append(
                f"- **Supplemental (companion):** {companion['repo']} @ "
                f"{companion['commit'][:10]} — {companion['chunk_count']:,} chunks "
                f"from {companion['file_count']} files (community BSD-2, unverified)"
            )
        lines += ["", "### Top categories by chunk count", ""]
        lines += [f"- {name}: {count:,}" for name, count in top]
        lines.append("")

        with open("release_notes.md", "w", encoding="utf-8") as f:
            f.write("\n".join(lines))
        print("\n".join(lines))
        EOF

    - name: Create GitHub release
      if: github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.mode != 'freeze'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('kb-{0}', github.run_number) }}
        name: Knowledge Base Build ${{ inputs.release_tag != '' && inputs.release_tag || github.run_number }}
        files: boomi_knowledge_db.tar.gz
        body_path: release_notes.md
        generate_release_notes: true
